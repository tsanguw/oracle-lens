name: CI

# Runs the tests, the type checks and the production build on every pull request and on every push to main and dev.
# It uses a throwaway Postgres container and no repository secrets, so it cannot touch the live database or bucket.
on:
  pull_request:
  push:
    branches: [main, dev]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API tests and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # the same login the tests use on a developer machine (see docker-compose.yml)
          POSTGRES_USER: lolstats
          POSTGRES_PASSWORD: lolstats
          POSTGRES_DB: lolstats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lolstats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The suite drops, recreates and migrates its own lolstats_test database on that server.
      - run: npm test

  sync:
    name: Sync tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # the Cloudflare functions (sitemap.xml, robots.txt) have no dependencies; Node's own test runner covers them
      - run: npm run test:functions
      # `build` runs tsc first, so a type error fails here as well as a bundling error
      - run: npm run build
