name: Secret scan

# Fails the run if a secret-shaped string is in any tracked file or in any line ever added to a commit.
# It prints where (file and line), never the text. Runs on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, so earlier commits are scanned too
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/scan_secrets.py --history
