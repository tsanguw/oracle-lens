name: Nightly sync

# Loads new games, match dates and rounds from Leaguepedia into the production database, and uploads any new team logos
# and player photos to R2.
# Needs seven repository secrets (Settings > Secrets and variables > Actions; `python sync/set_github_secrets.py` sets them):
#   DATABASE_URL (the Neon string), LEAGUEPEDIA_BOT_USER, LEAGUEPEDIA_BOT_PASSWORD,
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
# It is manual-only until a manual run (Actions > Nightly sync > Run workflow) has succeeded; then uncomment the schedule.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 12 * * *"   # daily, 12:00 UTC

permissions:
  contents: read

concurrency:
  group: nightly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4
      - name: Check that every secret is set
        working-directory: .
        run: |
          missing=0
          for name in DATABASE_URL LEAGUEPEDIA_BOT_USER LEAGUEPEDIA_BOT_PASSWORD R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set (run python sync/set_github_secrets.py, or add it under Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          exit $missing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAGUEPEDIA_BOT_USER: ${{ secrets.LEAGUEPEDIA_BOT_USER }}
          LEAGUEPEDIA_BOT_PASSWORD: ${{ secrets.LEAGUEPEDIA_BOT_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Apply database migrations
        working-directory: api
        run: |
          npm ci
          npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Sync new games
        run: python main.py nightly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAGUEPEDIA_BOT_USER: ${{ secrets.LEAGUEPEDIA_BOT_USER }}
          LEAGUEPEDIA_BOT_PASSWORD: ${{ secrets.LEAGUEPEDIA_BOT_PASSWORD }}
      - name: Fetch new logos and photos, upload them to R2
        run: |
          python main.py images --only teams --only players --r2 --out ../img-cache
          python main.py upload-images --from ../img-cache
          python main.py logo-tones --out ../img-cache
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAGUEPEDIA_BOT_USER: ${{ secrets.LEAGUEPEDIA_BOT_USER }}
          LEAGUEPEDIA_BOT_PASSWORD: ${{ secrets.LEAGUEPEDIA_BOT_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
